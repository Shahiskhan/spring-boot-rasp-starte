services:
  rasp-demo:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      RASP_MODE: BLOCK
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    stop_grace_period: 30s
