name: Build and verify
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_performance:
        description: Run the opt-in local performance characterization
        type: boolean
        default: false
      run_container:
        description: Run the packaged demo in Testcontainers (requires Docker)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build, run tests, and enforce coverage
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Retain test and coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            **/target/surefire-reports/
            **/target/site/jacoco/
          if-no-files-found: warn
  performance:
    if: github.event_name == 'workflow_dispatch' && inputs.run_performance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Characterize core engine on the runner
        run: mvn --batch-mode --no-transfer-progress -pl rasp-core -Drasp.perf=true -Djacoco.skip=true -Dtest=RaspEnginePerfTest test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-results
          path: |
            rasp-core/target/surefire-reports/
            rasp-core/target/rasp-performance.txt
  container:
    if: github.event_name == 'workflow_dispatch' && inputs.run_container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify packaged demo with real HTTP inside Docker
        run: mvn --batch-mode --no-transfer-progress verify -Pdocker-it
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-integration-results
          path: rasp-samples/target/failsafe-reports/
